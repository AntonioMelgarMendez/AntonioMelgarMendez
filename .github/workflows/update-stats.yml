name: Update profile stats

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_stats.py'
      - 'scripts/pixel_art.py'
      - 'tests/**'
      - '.github/workflows/update-stats.yml'

permissions:
  contents: read

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test the generator
        run: python3 -m unittest discover -s tests -v
      - name: Generate cards from public data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_stats.py
      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-languages.svg assets/stats.json
          if git diff --cached --quiet; then
            echo "Stats are already up to date."
            exit 0
          fi
          git commit -m "chore: refresh public profile stats"
          git push
